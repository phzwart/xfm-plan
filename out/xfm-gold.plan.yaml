    kind: not_in_corpus
  - field: implemented_in
    kind: contested
    note: The trace attributes atmospheric correction to Omnic export; SMAK also implements it. Which ran is not stated.
- id: xfm:t/ftir_rmies_correction
  name: resonant Mie scattering correction
  purpose: Separate the resonant-Mie scattering contribution from chemical absorbance using a reference spectrum, for samples with scattering morphology.
  consumes:
  - xfm:ds/ftir_atm
  produces:
  - xfm:ds/ftir_scatter_corrected
  adds_qualifiers:
  - scatter_corrected
  parameters:
  - xfm:p/mie_reference
  justified_by: []
  implemented_in:
  - software: SMAK
    version: 3.0.11
    component: IR_MathClass.DoNorm -> octavvs mie.rmiesc
    grit: q:code-ir-mie
  support:
  - field: purpose
    grit: q:code-ir-mie
    how: quote
  gaps:
  - field: justified_by
    kind: not_in_corpus
    note: Not used in the trace; offered by SMAK; rationale is in the OCTAVVS/RMieS literature, not registered.
- id: xfm:t/ftir_sg_denoise
  name: Savitzky-Golay denoising
  purpose: Reduce high-frequency noise while preserving band shape and position.
  consumes:
  - xfm:ds/ftir_atm
  produces:
  - xfm:ds/ftir_denoised
  adds_qualifiers:
  - denoised
  parameters:
  - xfm:p/sg_window
  - xfm:p/sg_order
  justified_by:
  - xfm:r/sg_denoise
  discards:
  - high-frequency content
  implemented_in:
  - software: SMAK
    version: 3.0.11
    component: IR_MathClass.DoNorm -> scipy.signal.savgol_filter
    grit: q:code-ir-sg
  support:
  - field: purpose
    grit: q:pist-ftir-atm
    how: quote
- id: xfm:t/ftir_rubberband_baseline
  name: rubberband baseline correction
  purpose: Remove the smooth scattering offset by subtracting the convex hull of each spectrum.
  consumes:
  - xfm:ds/ftir_denoised
  produces:
  - xfm:ds/ftir_baselined
  adds_qualifiers:
  - baseline_corrected
  justified_by:
  - xfm:r/rubberband
  implemented_in:
  - software: SMAK
    version: 3.0.11
    component: IR_MathClass.DoNorm -> octavvs baseline.rubberband (default 'Rubberband'; alternatives Concave Rubberband, AsLS, arPLS)
    grit: q:code-ir-rubber
  support:
  - field: purpose
    grit: q:pist-rubberband
    how: quote
  - field: implemented_in
    grit: q:code-ir-defaults
    how: quote
- id: xfm:t/ftir_mean_normalization
  name: mean normalization at a wavenumber
  purpose: Scale each spectrum so intensities are comparable across pixels, using a chosen wavenumber as the normalizer.
  consumes:
  - xfm:ds/ftir_baselined
  produces:
  - xfm:ds/ftir_spectrum_pre
  adds_qualifiers:
  - mean_normalized
  parameters:
  - xfm:p/norm_wavenumber
  justified_by: []
  validated_by:
  - xfm:v/norm_invariance
  discards:
  - absolute absorbance scale
  introduces:
  - dependence on normalizer band
  implemented_in:
  - software: SMAK
    version: 3.0.11
    component: IR_MathClass.DoNorm -> octavvs normalization.normalize_spectra (default 'Mean')
    grit: q:code-ir-norm
  support:
  - field: purpose
    grit: q:pist-norm-1655
    how: quote
  gaps:
  - field: justified_by
    kind: not_in_corpus
goals:
- id: xfm:g/relative_distribution
  name: relative elemental distribution
  statement: Map where each element is, comparably between control and treatment, without absolute concentrations.
  claim_type: xfm:ds/claim_relative_distribution
  satisfied_by:
  - xfm:ds/claim_relative_distribution
  - xfm:ds/scaled_map
  - xfm:ds/normalized_map
  support:
  - field: statement
    grit: q:pushie-i0
    how: quote
- id: xfm:g/colocalization
  name: element–biomolecule co-localization under treatment
  statement: Determine which elemental and biomolecular signals co-vary spatially and how that changes with salinity treatment.
  claim_type: xfm:ds/claim_colocalization
  satisfied_by:
  - xfm:ds/claim_colocalization
  validated_by:
  - xfm:v/registration_rmse
- id: xfm:g/absolute_concentration
  name: absolute areal or mass concentration
  statement: Report element concentration in ug/cm2 or mass fraction.
  claim_type: xfm:ds/areal_concentration_map
  satisfied_by:
  - xfm:ds/areal_concentration_map
  - xfm:ds/mass_fraction_map
  support:
  - field: statement
    grit: q:pushie-areal
    how: quote
  - field: satisfied_by
    grit: q:sole-fp-unknowns
    how: quote
workflows:
- id: xfm:w/pistachio_multimodal
  name: pistachio multimodal XRF+FTIR workflow (as run)
  serves:
  - xfm:g/relative_distribution
  - xfm:g/colocalization
  starts_from:
  - xfm:ds/mca_spectrum
  - xfm:ds/ftir_spectrum
  - xfm:ds/optical_image
  ends_at:
  - xfm:ds/claim_colocalization
  validated_by:
  - xfm:v/registration_rmse
  - xfm:v/norm_invariance
  steps:
  - step_id: s1
    transformation: xfm:t/spectrum_fit
    condition: xfm:d/fit_vs_roi
    condition_option: fit
    role: conditional
  - step_id: s2
    transformation: xfm:t/deadtime_correction
    preceded_by:
    - s1
    condition: xfm:d/deadtime
    condition_option: apply
    role: conditional
  - step_id: s3
    transformation: xfm:t/gaussian_smoothing
    preceded_by:
    - s1
    parameter_values:
    - parameter: xfm:p/blur_size
      value: '5'
      deviates_from_default: false
    - parameter: xfm:p/blur_sigma
      value: '0.75'
      deviates_from_default: true
  - step_id: s4
    transformation: xfm:t/group_scaling
    preceded_by:
    - s3
  - step_id: s5
    transformation: xfm:t/optical_stitch
  - step_id: s6
    transformation: xfm:t/optical_resize
    preceded_by:
    - s5
  - step_id: s7a
    transformation: xfm:t/ftir_atmospheric_correction
  - step_id: s7b
    transformation: xfm:t/ftir_sg_denoise
    preceded_by:
    - s7a
    parameter_values:
    - parameter: xfm:p/sg_window
      value: '9'
    - parameter: xfm:p/sg_order
      value: '3'
  - step_id: s7c
    transformation: xfm:t/ftir_rubberband_baseline
    preceded_by:
    - s7b
  - step_id: s7d
    transformation: xfm:t/ftir_mean_normalization
    preceded_by:
    - s7c
    parameter_values:
    - parameter: xfm:p/norm_wavenumber
      value: '1655'
  - step_id: s7v
    transformation: xfm:t/ftir_mean_normalization
    preceded_by:
    - s7c
    role: validation
    condition: xfm:d/norm_wavenumber
    condition_option: 2900 cm-1
    parameter_values:
    - parameter: xfm:p/norm_wavenumber
      value: '2900'
  - step_id: s8
    transformation: xfm:t/ftir_band_binning
    preceded_by:
    - s7d
  - step_id: s9
    transformation: xfm:t/manual_registration
    preceded_by:
    - s4
    - s6
    - s8
    condition: xfm:d/registration_mode
    condition_option: manual
    role: loop
    loop_group: registration
    loop_exit: xfm:v/least_shear
    parameter_values:
    - parameter: xfm:p/n_markers
      value: up to 35
  - step_id: s10
    transformation: xfm:t/multifile_weighted_fa
    preceded_by:
    - s9
  - step_id: s11
    transformation: xfm:t/component_effect_statistics
    preceded_by:
    - s10
  - step_id: s12
    transformation: xfm:t/channel_component_correlation
    preceded_by:
    - s10
  support:
  - field: steps
    grit: q:pist-fit
    how: quote
  - field: steps
    grit: q:pist-repeat
    how: quote
  - field: steps
    grit: der:ftir-steps-separate
    how: derived
  gaps:
  - field: steps
    kind: human_judgment
    note: Dead-time correction (s2) and flux normalization are not stated in the trace; s2 is recorded as conditional with the trace's status inferred 'not applied' (inf:pist-deadtime-not-applied); flux
      normalization status is unknown (inf:pist-i0-unknown) and is therefore not a step here.
    search_grit: abs:pist-i0
- id: xfm:w/absolute_quant_smak
  name: absolute quantification via thin-film standard (not run)
  serves:
  - xfm:g/absolute_concentration
  starts_from:
  - xfm:ds/mca_spectrum
  ends_at:
  - xfm:ds/areal_concentration_map
  steps:
  - step_id: a1
    transformation: xfm:t/spectrum_fit
  - step_id: a2
    transformation: xfm:t/quant_ratio_standard
    preceded_by:
    - a1
    condition: xfm:d/quantify
    condition_option: ratio to thin-film standard
    role: conditional
  alternative_to:
  - xfm:w/absolute_quant_fp
  support:
  - field: steps
    grit: q:smak-i0-auto
    how: quote
- id: xfm:w/absolute_quant_fp
  name: absolute quantification via fundamental parameters (not run)
  serves:
  - xfm:g/absolute_concentration
  starts_from:
  - xfm:ds/mca_spectrum
  ends_at:
  - xfm:ds/mass_fraction_map
  steps:
  - step_id: b1
    transformation: xfm:t/spectrum_fit
  - step_id: b2
    transformation: xfm:t/quant_fp
    preceded_by:
    - b1
    condition: xfm:d/quantify
    condition_option: fundamental parameters
    role: conditional
  alternative_to:
  - xfm:w/absolute_quant_smak
  support:
  - field: steps
    grit: q:sole-fp-unknowns
    how: quote
