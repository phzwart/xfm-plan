- id: xfm:t/multifile_weighted_fa
  name: multifile weighted factor analysis
  purpose: Decompose the registered multimodal stacks of control and treatment jointly into shared components, so pixel-wise co-variation patterns can be compared between samples.
  consumes:
  - xfm:ds/registered_stack
  produces:
  - xfm:ds/fa_scores
  - xfm:ds/fa_loadings
  parameters:
  - xfm:p/fa_weighting
  requires:
  - xfm:pre/common_grid
  assumes:
  - xfm:a/shared_loadings
  - xfm:a/variance_is_chemistry
  justified_by:
  - xfm:r/fa_weighting
  - xfm:r/pca_variance
  preserves:
  - total variance (all channels retained as components)
  introduces:
  - shared latent space; sign/scale indeterminacy of components
  - 'sign convention: largest-magnitude loading positive'
  implemented_in:
  - software: SMAK
    version: 3.0.11
    component: WeightedGroupPCA.GroupPCA.doWtPCABalance (pcatype FA)
    grit: q:code-fa-adj
  support:
  - field: purpose
    grit: q:pist-fa-shared
    how: quote
  - field: assumes
    grit: q:smak-pca-assume
    how: quote
    note: PCA assumption applied to FA by analogy
  - field: governing_relation
    grit: der:fa-weighting
    how: derived
  - field: governing_relation
    grit: q:code-fa-adj
    how: quote
  - field: governing_relation
    grit: q:code-fa-cycles
    how: quote
  gaps: []
  governing_relation: n_g = (1/|g|) sum_{c in g} sum_k |L_kc};  w_g = max_g' n_g' / n_g;  channels in g scaled by w_g; re-estimate for 3 cycles; FA via sklearn.decomposition.FactorAnalysis; component sign
    flipped so max|loading| > 0
- id: xfm:t/component_effect_statistics
  name: component effect statistics
  purpose: Identify which shared components differ between control and treatment, by variance ratio and Cohen's d over component scores.
